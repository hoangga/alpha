<title>Nhà Hàng Triệu Phú</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap">
<style>
/* Layout: phone-first game shell. Chunky top bar (level ring + currencies), 3D stage, bottom nav of big rounded buttons, modal sheets. Single warm "cartoon diner" look by choice. */
:root{
  --cream:#fff7e8;--cream2:#ffeccc;--brown:#6b3f1f;--brown2:#8d5a34;--ink:#3a2412;
  --orange:#ff9f1c;--orange2:#e07f00;--teal:#2ec4b6;--teal2:#1f9d92;--red:#e63946;--red2:#b52532;
  --gold:#ffc93c;--gem:#5aa9ff;--green:#3cb371;--green2:#2a8a55;--sky:#bfe6f5;
  --font:"Baloo 2","Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:#2a1a0e;color:var(--ink);font-family:var(--font);display:flex;justify-content:center;-webkit-tap-highlight-color:transparent}
#app{width:100%;max-width:560px;height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden;background:var(--sky);user-select:none;-webkit-user-select:none}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible{outline:3px solid var(--gem);outline-offset:2px}
/* top bar */
.top{display:flex;align-items:center;gap:8px;padding:8px 10px;background:linear-gradient(#7a4a26,#5f381a);border-bottom:3px solid #3e230f;box-shadow:0 3px 0 rgba(0,0,0,.15);position:relative;z-index:3}
.lvl{position:relative;width:46px;height:46px;flex:0 0 46px;border:0;background:none;padding:0}
.lvl svg{position:absolute;inset:0}
.lvl b{position:absolute;inset:6px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe58a,#f5a623);display:grid;place-items:center;font-size:17px;color:#6b3a00;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.pills{display:flex;gap:6px;flex:1;min-width:0;flex-wrap:wrap}
.pill{display:flex;align-items:center;gap:4px;background:#3e230f;border-radius:20px;padding:1px 10px 1px 3px;color:#fff;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;box-shadow:inset 0 2px 0 rgba(0,0,0,.3)}
.pill i{font-style:normal;width:24px;height:24px;display:grid;place-items:center;font-size:16px}
.pill.bump{animation:bump .35s}
@keyframes bump{40%{transform:scale(1.15)}}
/* stage */
#stage{flex:1;min-height:0;position:relative}
canvas{display:block;width:100%;height:100%;touch-action:none}
#views{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px;z-index:2}
.rb{width:44px;height:44px;border-radius:14px;border:0;background:var(--cream);box-shadow:0 3px 0 #c9a77a,0 4px 8px rgba(0,0,0,.2);font-size:20px;display:grid;place-items:center;line-height:1}
.rb small{display:block;font-size:9px;font-weight:700;margin-top:-4px}
.rb.on{background:var(--orange);color:#fff;box-shadow:0 3px 0 var(--orange2)}
.rb:active{transform:translateY(2px);box-shadow:0 1px 0 #c9a77a}
#board{position:absolute;top:8px;left:8px;width:min(196px,48%);max-height:34%;overflow:auto;background:var(--cream);border-radius:14px;box-shadow:0 3px 0 #c9a77a,0 6px 14px rgba(0,0,0,.18);padding:6px 8px;font-size:12px;line-height:1.2;z-index:2}
#board .h{display:flex;justify-content:space-between;font-weight:800;font-size:13px;cursor:pointer;color:var(--brown)}
#board.min .r,#board.min .empty{display:none}
#board .r{display:grid;grid-template-columns:20px 1fr auto;gap:2px 6px;align-items:center;padding:4px 0;border-top:1px dashed #e3c99b;cursor:pointer;font-variant-numeric:tabular-nums}
#board .r .d{font-size:16px;grid-row:span 2}
#board .r .l{font-weight:700;min-width:0}
#board .r .t{grid-column:2/4;height:5px;border-radius:3px;background:#ead7b4;overflow:hidden}
#board .r .t i{display:block;height:100%}
#board .r .s{font-weight:800}
#board .empty{color:#8a6a48;padding-top:3px}
#fly{position:absolute;inset:0;pointer-events:none;z-index:6;overflow:hidden}
.coin{position:absolute;font-size:20px;transition:transform .7s cubic-bezier(.5,-.3,.7,1),opacity .7s;will-change:transform}
/* bottom nav */
.nav{display:flex;gap:6px;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));background:linear-gradient(#7a4a26,#5f381a);border-top:3px solid #3e230f;position:relative;z-index:3}
.nb{flex:1;min-width:0;border:0;border-radius:14px;background:var(--cream);box-shadow:0 4px 0 #c9a77a;padding:4px 0 2px;display:flex;flex-direction:column;align-items:center;font-weight:700;font-size:11px;position:relative;line-height:1.1}
.nb span{font-size:22px;line-height:1.2}
.nb:active{transform:translateY(3px);box-shadow:0 1px 0 #c9a77a}
.nb.on{background:var(--orange);color:#fff;box-shadow:0 4px 0 var(--orange2)}
.badge{position:absolute;top:-6px;right:4px;background:var(--red);color:#fff;border-radius:10px;font-size:11px;padding:0 6px;border:2px solid #fff}
/* decorate tray */
#deco{position:absolute;left:0;right:0;bottom:0;z-index:4;background:var(--cream);border-top:3px solid var(--brown2);border-radius:16px 16px 0 0;padding:8px 10px calc(10px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 18px rgba(0,0,0,.2)}
#deco .row1{display:flex;gap:6px;align-items:center;margin-bottom:6px}
#deco .tabs{display:flex;gap:4px;flex:1;min-width:0;overflow-x:auto}
.tab{border:0;border-radius:10px;padding:3px 10px;background:var(--cream2);font-weight:700;font-size:13px;white-space:nowrap}
.tab.on{background:var(--brown);color:#fff}
.btn{border:0;border-radius:12px;padding:5px 14px;font-weight:800;color:#fff;background:var(--green);box-shadow:0 3px 0 var(--green2)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--green2)}
.btn.o{background:var(--orange);box-shadow:0 3px 0 var(--orange2)}
.btn.r{background:var(--red);box-shadow:0 3px 0 var(--red2)}
.btn:disabled{background:#c8b8a0;box-shadow:0 3px 0 #a8967c;cursor:default}
#deco .cards{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px}
.card{flex:0 0 78px;border:2px solid #ead1a6;border-radius:14px;background:#fff;padding:4px 2px 3px;text-align:center;line-height:1.1;font-weight:700;font-size:12px;position:relative}
.card .e{font-size:28px;display:block;line-height:1.25}
.card .c{display:block;font-size:11px;color:var(--brown2)}
.card .bt{position:absolute;top:2px;left:4px;font-size:10px;color:#b07a00}
.card.sel{border-color:var(--teal);background:#e3fbf8;box-shadow:0 0 0 2px var(--teal)}
.card:disabled{opacity:.45}
#deco .hint{font-size:12px;color:#7a5a3a;margin-top:2px;min-height:15px}
/* modal */
.modal{position:absolute;inset:0;z-index:8;background:rgba(40,22,8,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-height:78%;background:var(--cream);border-radius:20px 20px 0 0;display:flex;flex-direction:column;animation:up .22s ease-out;overflow:hidden}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sheet header{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--orange);color:#fff}
.sheet h2{margin:0;font-size:20px;flex:1;text-shadow:0 2px 0 rgba(0,0,0,.18);text-wrap:balance}
.x{border:0;width:34px;height:34px;border-radius:50%;background:#fff;color:var(--orange2);font-weight:800;font-size:18px;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.mb{overflow:auto;padding:10px 14px 18px;display:flex;flex-direction:column;gap:8px}
.it{display:flex;gap:10px;align-items:center;background:#fff;border:2px solid #f0dcb8;border-radius:14px;padding:8px 10px}
.it .e{font-size:30px;width:40px;text-align:center;flex:0 0 40px}
.it .m{flex:1;min-width:0}
.it .m b{display:block;font-size:15px}
.it .m small{display:block;color:#7a5a3a;font-size:12px;line-height:1.25}
.it.lock{opacity:.55}
.prog{height:8px;border-radius:5px;background:#f0dcb8;overflow:hidden;margin-top:4px}.prog i{display:block;height:100%;background:var(--teal)}
.lvtag{display:inline-block;background:var(--cream2);border-radius:8px;padding:0 6px;font-size:11px;font-weight:700;color:var(--brown2);margin-left:4px}
.sec{font-weight:800;color:var(--brown);font-size:13px;margin-top:4px}
/* toast + level up */
#toast{position:absolute;top:66px;left:50%;transform:translateX(-50%) translateY(-8px);background:rgba(58,36,18,.92);color:#fff;border-radius:14px;padding:6px 14px;opacity:0;transition:.25s;pointer-events:none;font-size:14px;text-align:center;z-index:9;max-width:88%;font-weight:600}
#toast.on{opacity:1;transform:translateX(-50%)}
.lvup{position:absolute;inset:0;z-index:10;display:grid;place-items:center;background:rgba(40,22,8,.5)}
.lvup .card2{background:var(--cream);border-radius:22px;padding:18px 22px;text-align:center;width:min(300px,82%);box-shadow:0 8px 0 #c9a77a;animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.4)}}
.lvup h3{margin:0;font-size:28px;color:var(--orange2);text-shadow:0 2px 0 #ffe0a8}
.lvup .big{font-size:58px;line-height:1.1}
.cf{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards;z-index:11;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){.sheet,.lvup .card2{animation:none}.cf{display:none}}
</style>
<div id="app">
  <header class="top">
    <button class="lvl" id="lvlBtn" aria-label="Cấp độ"><svg viewBox="0 0 46 46"><circle cx="23" cy="23" r="20" fill="none" stroke="#3e230f" stroke-width="5"/><circle id="xpRing" cx="23" cy="23" r="20" fill="none" stroke="#7ee081" stroke-width="5" stroke-linecap="round" transform="rotate(-90 23 23)" stroke-dasharray="125.7" stroke-dashoffset="125.7"/></svg><b id="lvn">1</b></button>
    <div class="pills">
      <span class="pill" id="pCoin"><i>🪙</i><span id="coins">0</span></span>
      <span class="pill" id="pGem"><i>💎</i><span id="gems">0</span></span>
      <span class="pill" title="Độ đẹp"><i>✨</i><span id="beauty">0</span></span>
      <span class="pill" title="Đánh giá"><i>⭐</i><span id="stars">5.0</span></span>
    </div>
  </header>
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="board"></div>
    <div id="views">
      <button class="rb on" data-v="all" aria-label="Toàn cảnh">🗺️<small>Tất cả</small></button>
      <button class="rb" data-v="dining" aria-label="Phòng ăn">🍽️<small>Quán</small></button>
      <button class="rb" data-v="kitchen" aria-label="Bếp">👨‍🍳<small>Bếp</small></button>
      <button class="rb" data-v="patio" aria-label="Sân">⛱️<small>Sân</small></button>
    </div>
    <div id="fly"></div>
  </div>
  <nav class="nav">
    <button class="nb" id="nMenu"><span>🍜</span>Thực đơn</button>
    <button class="nb" id="nStaff"><span>🧑‍🍳</span>Nhân viên</button>
    <button class="nb" id="nDeco"><span>🛋️</span>Trang trí</button>
    <button class="nb" id="nQuest"><span>📜</span>Nhiệm vụ<em class="badge" id="qBadge" hidden>0</em></button>
    <button class="nb" id="nSpeed"><span>⏩</span><b id="spd">x1</b></button>
  </nav>
  <div id="deco" hidden>
    <div class="row1"><div class="tabs" id="dTabs"></div><button class="btn" id="dDone">Xong</button></div>
    <div class="cards" id="dCards"></div>
    <div class="hint" id="dHint"></div>
  </div>
  <div class="modal" id="modal" hidden><div class="sheet" role="dialog" aria-modal="true"><header><h2 id="mTitle"></h2><button class="x" id="mClose" aria-label="Đóng">✕</button></header><div class="mb" id="mBody"></div></div></div>
  <div id="toast" role="status"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
// ================= DATA =================
const W=12,H=14,DOOR=[11,11];
const inKitchen=(x,y)=>x>=9&&x<=11&&y>=0&&y<=4;
const isPatio=y=>y>=10;
const DISHES=[
  {e:'🍜',n:'Phở bò',base:12,cook:6,unlock:1},
  {e:'🥖',n:'Bánh mì',base:8,cook:4,unlock:1},
  {e:'🍛',n:'Cơm tấm',base:18,cook:7,unlock:2},
  {e:'🥗',n:'Gỏi cuốn',base:15,cook:5,unlock:3},
  {e:'☕',n:'Cà phê sữa đá',base:7,cook:3,unlock:4},
  {e:'🍲',n:'Lẩu thái',base:42,cook:10,unlock:5},
];
// furniture catalogue: cost in coins (c) or gems (g); b = beauty points; zone: kitchen|patio|inside
const T={
  table:{n:'Bàn tròn',e:'🍽️',c:60,cat:'ban'},
  chair:{n:'Ghế đệm',e:'🪑',c:25,cat:'ban',seat:1},
  stove:{n:'Bếp nấu',e:'🔥',c:240,cat:'bep',zone:'kitchen'},
  plant:{n:'Cây xanh',e:'🌿',c:45,cat:'trang',b:3},
  flowers:{n:'Chậu hoa',e:'🌷',c:30,cat:'trang',b:2},
  rug:{n:'Thảm tròn',e:'🟠',c:35,cat:'trang',b:2,flat:1},
  lamp:{n:'Đèn cây',e:'💡',c:80,cat:'trang',b:4},
  tank:{n:'Bể cá',e:'🐠',c:320,cat:'trang',b:10},
  umbrella:{n:'Ô che nắng',e:'⛱️',c:90,cat:'trang',b:4,zone:'patio'},
  piano:{n:'Đàn piano',e:'🎹',g:10,cat:'vip',b:15,zone:'inside'},
  fountain:{n:'Đài phun nước',e:'⛲',g:15,cat:'vip',b:22,zone:'patio'},
  wall:{fixed:1},fence:{fixed:1},counter:{fixed:1},fridge:{fixed:1},sink:{fixed:1}
};
const CATS=[['ban','Bàn ghế'],['bep','Bếp'],['trang','Trang trí'],['vip','💎 Cao cấp'],['sell','🗑️ Bán']];
const QUEST_T=[
  {k:'serve',n:'Phục vụ {n} khách',e:'🍽️',n0:6},
  {k:'earn',n:'Kiếm {n} xu',e:'🪙',n0:250},
  {k:'tips',n:'Nhặt tiền tip {n} lần',e:'💰',n0:4},
  {k:'vip',n:'Phục vụ {n} khách VIP',e:'👑',n0:1},
  {k:'decor',n:'Đặt {n} món trang trí',e:'🌷',n0:2},
  {k:'dish',n:'Bán {n} phần {d}',e:'🍜',n0:4},
];
// ================= STATE =================
const S={coins:300,gems:5,xp:0,level:1,served:0,rSum:0,rN:0,speed:1,mode:'play',sel:null,cat:'ban',
  items:[],menu:DISHES.map(()=>1),waiters:2,chefLv:0,manager:false,quests:[]};
let uid=1;
const add=(type,x,y)=>{const o={id:uid++,type,x,y,born:performance.now()};S.items.push(o);return o};
function defaultLayout(){
  [['table',3,3],['chair',2,3],['chair',4,3],['table',3,6],['chair',2,6],['chair',4,6],['table',6,4],['chair',6,3],['chair',6,5],
   ['plant',0,8],['flowers',7,0],['rug',5,7],['table',3,12],['chair',2,12],['chair',4,12],['umbrella',6,12],['flowers',0,10],['stove',10,0],['stove',11,0]
  ].forEach(a=>add(...a))}
function fixedLayout(){
  add('counter',9,0);add('sink',9,1);add('fridge',11,4);
  for(const y of[0,1,3,4])add('wall',8,y);for(const x of[8,9,10,11])add('wall',x,5);
  for(let x=0;x<W;x++)if(x!=5&&x!=6)add('fence',x,9);
}
const at=(x,y)=>S.items.find(o=>o.x==x&&o.y==y&&!T[o.type].flat)||null;
const rugAt=(x,y)=>S.items.find(o=>o.x==x&&o.y==y&&T[o.type].flat)||null;
const isDoor=(x,y)=>x==DOOR[0]&&y==DOOR[1];
const beauty=()=>S.items.reduce((s,o)=>s+(T[o.type].b||0),0);
const dishPrice=i=>Math.round(DISHES[i].base*(1+.25*(S.menu[i]-1)));
const dishCook=i=>DISHES[i].cook/(1+S.chefLv*.25);
const dishUpCost=i=>Math.round(DISHES[i].base*12*1.55**(S.menu[i]-1));
const unlocked=()=>DISHES.map((d,i)=>i).filter(i=>DISHES[i].unlock<=S.level);
const waiterCost=()=>250*2**(S.waiters-1),chefCost=()=>Math.round(150*1.8**S.chefLv);
const xpNeed=()=>S.level*60;
const rating=()=>S.rN?S.rSum/S.rN:5;

// ================= SAVE (this browser only) =================
const SAVE='nhtp_save_v4';
function save(){try{localStorage.setItem(SAVE,JSON.stringify({coins:S.coins,gems:S.gems,xp:S.xp,level:S.level,served:S.served,rSum:S.rSum,rN:S.rN,menu:S.menu,waiters:S.waiters,chefLv:S.chefLv,manager:S.manager,quests:S.quests,
  items:S.items.filter(o=>!T[o.type].fixed).map(o=>[o.type,o.x,o.y])}))}catch(e){}}
function load(){let d=null;try{d=JSON.parse(localStorage.getItem(SAVE)||'null')}catch(e){}
  fixedLayout();
  if(!d||!Array.isArray(d.items)){defaultLayout();return}
  for(const k of['coins','gems','xp','level','served','rSum','rN','waiters','chefLv','manager'])if(d[k]!=null)S[k]=d[k];
  if(Array.isArray(d.menu))S.menu=DISHES.map((_,i)=>Math.max(1,d.menu[i]|0||1));
  if(Array.isArray(d.quests))S.quests=d.quests;
  d.items.forEach(([t,x,y])=>{if(T[t]&&!T[t].fixed&&!at(x,y))add(t,x,y)})}

// ================= PATHFINDING (4-neighbour BFS on tiles) =================
function blocked(x,y,allow){if(x<0||y<0||x>=W||y>=H)return true;if(allow&&allow[0]==x&&allow[1]==y)return false;const o=at(x,y);return !!o}
function bfs(from,goals,allow){
  const fx=Math.floor(from[0]),fy=Math.floor(from[1]),key=(x,y)=>x*32+y;
  const seen=new Map([[key(fx,fy),-1]]),q=[[fx,fy]],gs=new Set(goals.map(g=>key(g[0],g[1])));
  for(let qi=0;qi<q.length;qi++){const[x,y]=q[qi];
    if(gs.has(key(x,y))){const p=[];let k=key(x,y);while(seen.get(k)!==-1){p.unshift([k/32|0,k%32]);k=seen.get(k)}return p}
    for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy,nk=key(nx,ny);
      if(seen.has(nk)||blocked(nx,ny,allow))continue;seen.set(nk,key(x,y));q.push([nx,ny])}}
  return null}
const N4=o=>[[1,0],[-1,0],[0,1],[0,-1]].map(d=>[o.x+d[0],o.y+d[1]]);
const freeN=o=>N4(o).filter(t=>!blocked(t[0],t[1]));
const tableOf=ch=>N4(ch).map(t=>at(t[0],t[1])).find(o=>o&&o.type=='table')||null;
function walk(e,dt,sp=2.3){
  if(!e.path.length)return true;
  const[tx,ty]=e.path[0],dx=tx+.5-e.x,dy=ty+.5-e.y,d=Math.hypot(dx,dy),s=sp*dt;
  if(d<=s){e.x=tx+.5;e.y=ty+.5;e.path.shift()}else{e.x+=dx/d*s;e.y+=dy/d*s}
  return !e.path.length}

// ================= SIMULATION =================
let customers=[],waiters=[],orders=[],fx=[],events=[];
const SKIN=['#ffe0c4','#f6cfa6','#e2a878','#b97a50','#8a5534'];
const HAIRC=['#2b1b12','#5a3820','#e8c066','#c0392b','#1a1a1a','#a0522d','#7a5cc0','#f08aa8'];
const SHIRT=['#ff7b7b','#5fb8ff','#7ed67e','#ffb84d','#b58cff','#ff8fc8','#4fd1c5','#f4e04d'];
const PANTS=['#3a4a6b','#4a3b2a','#2f5f5f','#5b4a7a','#6b6b6b'];
const STYLES=['short','pony','buns','bob','spiky','cap','short','bob'];
const pick=a=>a[Math.random()*a.length|0];
function mkWaiter(i){return{x:5.5+i*.5,y:7.5,path:[],task:null,carry:null,role:'w',look:{skin:pick(SKIN),hair:pick(HAIRC),style:i%2?'pony':'short',shirt:'#ffffff',pants:'#2a2a33'}}}
function freeChairs(){return S.items.filter(o=>o.type=='chair'&&!o.dirty&&!customers.some(c=>c.chair===o)&&tableOf(o))}
let spawnT=1.5;
function spawn(){
  const ch=freeChairs();if(!ch.length)return;
  const chair=pick(ch),path=bfs(DOOR,[[chair.x,chair.y]],[chair.x,chair.y]);if(!path)return;

function tap(e){
  const t=groundTile(e);

    ray.setFromCamera(ndc(e),cam);

    const tips=[...itemObj.entries()].filter(([id,v])=>v.g.userData.tip&&v.g.userData.tip.visible);
    const th=ray.intersectObjects(tips.map(([id,v])=>v.g.userData.tip),true)[0];
    if(th){const id=tips.find(([i,v])=>{let o=th.object;while(o){if(o===v.g.userData.tip)return true;o=o.parent}return false});if(id){collectTip(S.items.find(o=>o.id==id[0]));return}}
    if(t){const o=S.items.find(o=>o.type=='chair'&&o.tip&&Math.abs(o.x-t[0])+Math.abs(o.y-t[1])<=1&&(tableOf(o)||{}).x==t[0]&&(tableOf(o)||{}).y==t[1]);if(o){collectTip(o);return}}

    for(const h of hits){let o=h.object;while(o&&!ents.some(([c,a])=>a.g===o))o=o.parent;const f=o&&ents.find(([c,a])=>a.g===o);
      if(f&&f[0].st=='wait'){f[0].pri=true;toast('Ưu tiên phục vụ khách này!');return}}
    return}
  if(!t)return;const[x,y]=t;
  if(S.sel=='sell'){const o=at(x,y)||rugAt(x,y);if(!o)return;if(T[o.type].fixed){toast('Không bán được phần này của quán');return}

    S.items=S.items.filter(i=>i!==o);const d=T[o.type];if(d.c)S.coins+=Math.floor(d.c/2);else S.gems+=Math.floor(d.g/2);bump('pCoin');renderDeco();save();return}
  if(!S.sel){toast('Chọn một món ở khay bên dưới trước');return}
  const d=T[S.sel];
  if(d.c&&S.coins<d.c||d.g&&S.gems<d.g){toast(d.g?'Chưa đủ kim cương':'Chưa đủ xu');return}

  const wc=waiterCost(),cc=chefCost();
  $('mBody').innerHTML=`<div class="it"><span class="e">🧑‍💼</span><div class="m"><b>Phục vụ<span class="lvtag">${S.waiters}/4</span></b><small>Nhận order, bưng món, dọn bàn. Càng đông càng nhanh.</small></div>${S.waiters>=4?'<b>Đủ người</b>':btn(wc+' 🪙',S.coins>=wc,'o','hire')}</div>
  <div class="it"><span class="e">👨‍🍳</span><div class="m"><b>Tay nghề đầu bếp<span class="lvtag">Lv ${S.chefLv}</span></b><small>Mỗi cấp nấu nhanh hơn 25% cho mọi món.</small></div>${S.chefLv>=8?'<b>Tối đa</b>':btn(cc+' 🪙',S.coins>=cc,'o','chef')}</div>
  <div class="it"><span class="e">🕴️</span><div class="m"><b>Quản lý</b><small>Tự nhặt tiền tip trên bàn giúp bạn.</small></div>${S.manager?'<b>Đã thuê</b>':btn('12 💎',S.gems>=12,'o','manager')}</div>
  <div class="sec">Mẹo</div><div class="it"><span class="e">💰</span><div class="m"><small>Khách ăn xong để lại túi tiền tip trên bàn. Chạm vào để nhặt, nếu không sau 25 giây sẽ tự vào két.</small></div></div>`}
function questPanel(){ensureQuests();
  $('mBody').innerHTML=`<div class="sec">Hoàn thành để nhận thưởng. Nhận xong sẽ có nhiệm vụ mới.</div>`+S.quests.map((q,i)=>`<div class="it"><span class="e">${q.e}</span><div class="m"><b>${q.title}</b><small>Thưởng: ${q.coins} 🪙${q.gems?' + '+q.gems+' 💎':''}</small><div class="prog"><i style="width:${q.p/q.n*100}%"></i></div><small>${q.p}/${q.n}</small></div>${btn('Nhận',q.done,'','claim:'+i)}</div>`).join('')+
  `<div class="sec">Cài đặt</div><div class="it"><span class="e">↺</span><div class="m"><b>Chơi lại từ đầu</b><small>Xoá tiến trình đã lưu trên trình duyệt này.</small></div>${btn(resetArm?'Chắc chắn?':'Chơi lại',true,'r','reset')}</div>`}
let resetArm=false;
$('mBody').addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const[a,v]=b.dataset.act.split(':');
  if(a=='dish'){const i=+v,c=dishUpCost(i);if(S.coins>=c){S.coins-=c;S.menu[i]++;toast(DISHES[i].n+' lên Lv '+S.menu[i]+'!')}}
  if(a=='hire'&&S.coins>=waiterCost()){S.coins-=waiterCost();S.waiters++;waiters.push(mkWaiter(S.waiters-1));toast('Đã thuê thêm phục vụ!')}
  if(a=='chef'&&S.coins>=chefCost()){S.coins-=chefCost();S.chefLv++;toast('Đầu bếp nấu nhanh hơn!')}
  if(a=='manager'&&S.gems>=12){S.gems-=12;S.manager=true;toast('Quản lý sẽ tự nhặt tiền tip')}
  if(a=='claim'){const q=S.quests[+v];if(q&&q.done){S.coins+=q.coins;S.gems+=q.gems;S.quests.splice(+v,1);ensureQuests();toast('Nhận '+q.coins+' 🪙'+(q.gems?' + '+q.gems+' 💎':''));bump('pCoin')}}
  if(a=='reset'){if(!resetArm){resetArm=true;setTimeout(()=>{resetArm=false;refreshModal()},3000)}else{try{localStorage.removeItem(SAVE)}catch(_){}location.reload();return}}
  save();refreshModal()});
function navOn(id){document.querySelectorAll('.nb').forEach(b=>b.classList.toggle('on',b.id==id))}
$('nMenu').onclick=()=>{navOn('nMenu');openModal('Thực đơn',menuPanel)};
$('nStaff').onclick=()=>{navOn('nStaff');openModal('Nhân viên',staffPanel)};
$('nQuest').onclick=()=>{navOn('nQuest');openModal('Nhiệm vụ',questPanel)};
$('nSpeed').onclick=()=>{S.speed=S.speed==1?2:S.speed==2?4:1;$('spd').textContent='x'+S.speed};
// decorate tray
function renderDeco(){
  $('dTabs').innerHTML=CATS.map(([k,n])=>`<button class="tab ${S.cat==k?'on':''}" data-c="${k}">${n}</button>`).join('');
  if(S.cat=='sell'){$('dCards').innerHTML='<div class="hint" style="padding:8px">Chạm một món trong quán để bán lại, hoàn 50% giá.</div>';S.sel='sell'}
  else $('dCards').innerHTML=Object.entries(T).filter(([k,d])=>d.cat==S.cat).map(([k,d])=>{const cost=d.c?d.c+' 🪙':d.g+' 💎',ok=d.c?S.coins>=d.c:S.gems>=d.g;
    return`<button class="card ${S.sel==k?'sel':''}" data-k="${k}" ${ok?'':'disabled'}>${d.b?`<span class="bt">✨${d.b}</span>`:''}<span class="e">${d.e}</span>${d.n}<span class="c">${cost}</span></button>`}).join('');
  $('dHint').textContent=S.sel=='sell'?'Chạm món đồ cần bán.':S.sel?`Chạm ô sàn để đặt ${T[S.sel].n.toLowerCase()}. Ô xanh là đặt được.`:'Chọn món đồ, rồi chạm ô trên sàn. Kéo để xoay góc nhìn.'}
$('dTabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(!b)return;S.cat=b.dataset.c;S.sel=S.cat=='sell'?'sell':null;renderDeco()});
$('dCards').addEventListener('click',e=>{const b=e.target.closest('.card');if(!b||b.disabled)return;S.sel=S.sel==b.dataset.k?null:b.dataset.k;renderDeco()});
$('nDeco').onclick=()=>{S.mode='deco';S.sel=null;$('deco').hidden=false;navOn('nDeco');renderDeco()};
$('dDone').onclick=()=>{S.mode='play';S.sel=null;$('deco').hidden=true;navOn('');save()};
// level up celebration
function levelUp(){
  const news=DISHES.filter(d=>d.unlock==S.level);
  const el=document.createElement('div');el.className='lvup';el.innerHTML=`<div class="card2"><div class="big">🎉</div><h3>Lên cấp ${S.level}!</h3><p>${news.length?'Mở món mới: '+news.map(d=>d.e+' '+d.n).join(', '):'Khách tới đông hơn.'}<br>Thưởng 2 💎</p><button class="btn o">Tuyệt!</button></div>`;
  $('app').appendChild(el);el.querySelector('button').onclick=()=>el.remove();
  const cols=['#ff6b8a','#ffd166','#2ec4b6','#5aa9ff','#ff9f1c','#7ee081'];
  for(let i=0;i<60;i++){const c=document.createElement('div');c.className='cf';c.style.left=rnd(0,100)+'%';c.style.background=pick(cols);c.style.animationDuration=rnd(1.6,3)+'s';c.style.animationDelay=rnd(0,.5)+'s';$('app').appendChild(c);setTimeout(()=>c.remove(),3800)}}

// ================= LOOP =================
load();ensureQuests();for(let i=0;i<S.waiters;i++)waiters.push(mkWaiter(i));
let last=performance.now(),clock=0,boardAt=0,saveAt=0;
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;clock+=dt;
  for(let i=0;i<S.speed;i++)tick(dt);
  for(const ev of events.splice(0)){if(ev.k=='coins')flyCoins(ev.x,ev.y,ev.n,ev.tip);if(ev.k=='level')levelUp();if(ev.k=='quest')refreshModal()}
  if(TGT.distanceTo(goalT)>.01||Math.abs(rad-goalR)>.05){TGT.lerp(goalT,.12);rad+=(goalR-rad)*.12;placeCam()}
  syncItems(clock,now);syncAvatars(clock,dt);syncFx();syncPuffs(dt);updateHover();
  renderer.render(scene,cam);hud();
  if(now-boardAt>250){boardAt=now;updateBoard()}
  if(now-saveAt>5000){saveAt=now;save()}
  requestAnimationFrame(loop)}
resize();view('all',true);requestAnimationFrame(loop);
setTimeout(()=>toast('Chào mừng! Khách vào từ cổng sân. Chạm 💰 trên bàn để nhặt tiền tip.'),600);
</script>

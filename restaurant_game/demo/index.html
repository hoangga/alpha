<title>Nhà Hàng Triệu Phú</title>
<style>
/* Layout: phone-sized game column centered; HUD on top, 2x3 table grid, shop drawer. Single dark-wood look by choice. */
:root{--wood:#5b3920;--wood2:#8d5a34;--floor:#f3e3c3;--table:#b77a45;--table2:#d9a066;--ink:#2a1a0e;--good:#0c7b56;--bad:#b02c3c;--blue:#2e86de;--paper:#fffaf0;--font:"Baloo 2",system-ui,sans-serif}
html,body{height:100%}
body{margin:0;background:#2a1a0e;color:var(--ink);font-family:var(--font);display:flex;justify-content:center}
#app{width:100%;max-width:440px;height:100%;display:flex;flex-direction:column;background:var(--floor);position:relative;overflow:hidden;user-select:none}
.hud{background:var(--wood);padding:10px 14px;display:flex;gap:8px;flex-wrap:wrap}
.chip{background:rgba(255,255,255,.92);border-radius:20px;padding:3px 12px;font-weight:700;font-variant-numeric:tabular-nums}
.shelf{background:var(--wood2);height:54px;display:flex;align-items:center;gap:10px;padding:0 14px;font-size:26px}
.shelf span.off{opacity:.3;font-size:16px}
.grid{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,1fr);min-height:0}
.cell{position:relative;display:flex;align-items:flex-end;justify-content:center;padding-bottom:22px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.cell.locked{opacity:.45;cursor:default}
.tbl{width:62%;max-width:120px;aspect-ratio:5/3;background:var(--table2);border:5px solid var(--table);border-radius:14px;position:relative}
.guest{position:absolute;left:50%;top:-40px;transform:translateX(-50%);font-size:32px;transition:left .5s}
.bubble{position:absolute;left:50%;top:-84px;transform:translateX(-50%);background:#fff;border-radius:12px;width:64px;height:34px;display:grid;place-items:center;font-size:22px;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.bar{position:absolute;left:0;right:0;bottom:-16px;height:8px;border-radius:4px;background:rgba(0,0,0,.2);overflow:hidden}
.bar i{display:block;height:100%;width:0}
.cell[data-s=ready] .bubble{animation:pop .6s infinite alternate}
@keyframes pop{to{transform:translateX(-50%) scale(1.12)}}
.float{position:absolute;font-weight:800;pointer-events:none;animation:up 1.1s forwards;z-index:5}
@keyframes up{to{transform:translateY(-50px);opacity:0}}
.dock{padding:10px 14px;display:flex;gap:8px;background:var(--paper);border-top:2px solid var(--table)}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:8px 14px;background:var(--wood);color:#fff;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.dock .hint{flex:1;font-size:13px;line-height:1.2;align-self:center}
.sheet{position:absolute;left:0;right:0;bottom:0;height:68%;background:var(--paper);border-radius:18px 18px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.4);transform:translateY(105%);transition:transform .25s;display:flex;flex-direction:column;z-index:10}
.sheet.open{transform:none}
.tabs{display:flex;gap:6px;padding:12px 14px 6px}
.tabs button{background:#e9d8b6;color:var(--ink);flex:1}.tabs button.on{background:var(--wood);color:#fff}
.list{overflow:auto;flex:1;padding:4px 14px}
.row{display:flex;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid #e9d8b6}
.row .ic{font-size:30px}.row .t{flex:1;min-width:0}.row b{display:block}.row small{color:#6b5640;line-height:1.2;display:block}
.top{display:flex;justify-content:space-between;align-items:center;padding:10px 14px 0;font-weight:800}
.toast{position:absolute;top:70px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:14px;padding:8px 14px;z-index:20;opacity:0;transition:opacity .3s;pointer-events:none;text-align:center;font-size:14px}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.cell[data-s=ready] .bubble{animation:none}}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap">
<div id="app">
  <div class="hud"><span class="chip" id="coins"></span><span class="chip" id="rating"></span><span class="chip" id="served"></span></div>
  <div class="shelf" id="shelf"></div>
  <div class="grid" id="grid"></div>
  <div class="dock"><div class="hint">Chạm bàn để nhận order, chạm lại để phục vụ. Thuê Phục vụ để tự động.</div><button id="fast" aria-pressed="false">x1</button><button id="open">Cửa hàng</button></div>
  <div class="sheet" id="sheet" role="dialog" aria-label="Cửa hàng">
    <div class="top"><span id="sc"></span><button id="close">Đóng</button></div>
    <div class="tabs" id="tabs"></div>
    <div class="list" id="list"></div>
  </div>
  <div class="toast" id="toast"></div>
</div>
<script>
const dishes=[['🍜',10],['🥪',16],['🍔',25],['🍕',40],['🍣',65],['🥩',100]];
const decor=[['plant','🪴','Chậu cây',150,.05,0],['lamp','💡','Đèn trang trí',400,0,.08],['carpet','🟥','Thảm đỏ',900,.1,0],['aquarium','🐠','Bể cá',2200,.1,.1],['piano','🎹','Đàn piano',6000,.2,.1],['chandelier','🔮','Đèn chùm',15000,.25,.15]];
const S={coins:50,served:0,rating:3,tables:2,menu:0,chef:0,waiter:0,decor:new Set()};
let speed=1,tab=0;
const g=(k)=>S[k];
const price=()=>1+S.menu*.35, tip=()=>[...S.decor].reduce((a,id)=>a+decor.find(d=>d[0]==id)[4],0), spawnB=()=>[...S.decor].reduce((a,id)=>a+decor.find(d=>d[0]==id)[5],0);
const cookT=()=>6/(1+S.chef*.3), spawnT=()=>Math.max(1.5,6/(1+spawnB()+(S.rating-3)*.1));
const waitD=()=>S.waiter?2.5/(1+(S.waiter-1)*.35):null;
const pay=d=>dishes[d][1]*price()*(1+tip())*(1+(S.rating-3)*.1);
const cost={table:()=>Math.round(120*2.6**(S.tables-2)),menu:()=>Math.round(200*2.4**S.menu),chef:()=>Math.round(80*1.7**S.chef),waiter:()=>Math.round(250*2**S.waiter)};
const T=[...Array(6)].map((_,i)=>({i,s:'empty',d:0,pat:1,p:0,auto:0,face:'🙂'}));
const grid=document.getElementById('grid');
T.forEach(t=>{const c=document.createElement('div');c.className='cell';c.innerHTML='<div class="tbl"><div class="guest"></div><div class="bubble"></div><div class="bar"><i></i></div></div>';c.addEventListener('pointerdown',()=>act(t));t.el=c;grid.appendChild(c)});
const faces=['😀','🙂','😋','🧑','👩','👨','🧓'];
function act(t){if(t.i>=S.tables)return;if(t.s=='waiting'){t.s='cooking';t.p=0;t.pat=Math.min(1,t.pat+.3)}else if(t.s=='ready'){t.s='eating';t.p=0}t.auto=0}
function fl(t,txt,col){const f=document.createElement('div');f.className='float';f.textContent=txt;f.style.color=col;f.style.left='42%';f.style.top='30%';t.el.appendChild(f);setTimeout(()=>f.remove(),1100)}
let spawn=1.5;
function tick(dt){
  spawn-=dt;
  if(spawn<=0){spawn=spawnT()*(.7+Math.random()*.6);const free=T.filter(t=>t.i<S.tables&&t.s=='empty');if(free.length){const t=free[Math.random()*free.length|0];t.s='waiting';t.d=Math.random()*Math.min(S.menu+1,6)|0;t.pat=1;t.p=0;t.auto=0;t.face=faces[Math.random()*faces.length|0]}}
  for(const t of T){if(t.i>=S.tables||t.s=='empty')continue;
    if(t.s=='waiting'||t.s=='ready'){t.pat-=dt/(t.s=='waiting'?18:25);
      if(t.pat<=0){S.rating=Math.max(1,S.rating-.15);fl(t,'😠','#b02c3c');t.s='empty';continue}
      const w=waitD();if(w!=null){t.auto+=dt;if(t.auto>=w)act(t)}}
    else if(t.s=='cooking'){t.p+=dt/cookT();if(t.p>=1){t.s='ready';t.p=0;t.auto=0}}
    else if(t.s=='eating'){t.p+=dt/3;if(t.p>=1){const m=pay(t.d);S.coins+=m;S.served++;S.rating=Math.min(5,S.rating+.03);fl(t,'+'+Math.round(m)+'🪙','#0c7b56');t.s='empty'}}}
}
function draw(){
  document.getElementById('coins').textContent='🪙 '+Math.floor(S.coins);
  document.getElementById('rating').textContent='⭐ '+S.rating.toFixed(1);
  document.getElementById('served').textContent='🍽️ '+S.served;
  document.getElementById('shelf').innerHTML='🚪'+decor.map(d=>S.decor.has(d[0])?`<span>${d[1]}</span>`:'<span class="off">·</span>').join('');
  for(const t of T){const c=t.el,lock=t.i>=S.tables;c.classList.toggle('locked',lock);c.dataset.s=t.s;
    const q=s=>c.querySelector(s),on=!lock&&t.s!='empty';
    q('.guest').hidden=q('.bubble').hidden=q('.bar').hidden=!on;
    if(lock){q('.tbl').style.opacity=.5;q('.guest').hidden=true;continue}q('.tbl').style.opacity=1;
    if(!on)continue;q('.guest').textContent=t.face;
    q('.bubble').textContent={waiting:dishes[t.d][0],cooking:'🍳',ready:'🛎️',eating:'😋'}[t.s];
    const prog=t.s=='cooking'||t.s=='eating',f=prog?t.p:t.pat,i=q('.bar i');
    i.style.width=Math.max(0,Math.min(1,f))*100+'%';i.style.background=prog?'#2e86de':`hsl(${Math.round(f*140)} 65% 38%)`}
  if(sheet.classList.contains('open'))shop();
}
const sheet=document.getElementById('sheet');
function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2200)}
function shop(){
  document.getElementById('sc').textContent='🪙 '+Math.floor(S.coins);
  const tabs=document.getElementById('tabs');tabs.innerHTML='';
  ['Nâng cấp','Nhân viên','Trang trí'].forEach((n,i)=>{const b=document.createElement('button');b.textContent=n;b.className=i==tab?'on':'';b.onclick=()=>{tab=i;shop()};tabs.appendChild(b)});
  const rows=[];
  const buy=(k,max)=>()=>{const c=cost[k]();if(S.coins>=c&&!max){S.coins-=c;S[k=='table'?'tables':k]++;}};
  if(tab==0){rows.push(['🪑','Thêm bàn',`Bàn ${S.tables}/6`,cost.table(),S.tables>=6,buy('table')]);rows.push([dishes[S.menu][0],'Thực đơn','Mở món mới, giá cao hơn',cost.menu(),S.menu>=5,buy('menu')])}
  if(tab==1){rows.push(['👨‍🍳','Đầu bếp',`Cấp ${S.chef}: nấu nhanh hơn`,cost.chef(),S.chef>=10,buy('chef')]);rows.push(['🧑‍💼','Phục vụ',`Cấp ${S.waiter}: tự nhận order và phục vụ`,cost.waiter(),S.waiter>=5,buy('waiter')])}
  if(tab==2)decor.forEach(d=>rows.push([d[1],d[2],`+${Math.round(d[4]*100)}% tiền, +${Math.round(d[5]*100)}% khách`,d[3],S.decor.has(d[0]),()=>{if(S.coins>=d[3]){S.coins-=d[3];S.decor.add(d[0])}}]));
  const l=document.getElementById('list');l.innerHTML='';
  rows.forEach(r=>{const e=document.createElement('div');e.className='row';e.innerHTML=`<span class="ic">${r[0]}</span><div class="t"><b>${r[1]}</b><small>${r[2]}</small></div>`;
    const b=document.createElement('button');if(r[4]){b.textContent='Tối đa';b.disabled=true}else{b.textContent=r[3]+' 🪙';b.disabled=S.coins<r[3];b.onclick=()=>{r[5]();draw()}}e.appendChild(b);l.appendChild(e)});
}
document.getElementById('open').onclick=()=>{sheet.classList.add('open');shop()};
document.getElementById('close').onclick=()=>sheet.classList.remove('open');
document.getElementById('fast').onclick=e=>{speed=speed==1?4:1;e.target.textContent='x'+speed;e.target.setAttribute('aria-pressed',speed>1)};
let last=performance.now();
setInterval(()=>{const n=performance.now(),dt=Math.min(.25,(n-last)/1000)*speed;last=n;tick(dt);draw()},100);
draw();
setTimeout(()=>toast('Khách đến! Chạm bàn có biểu tượng món để nhận order.'),600);
</script>
